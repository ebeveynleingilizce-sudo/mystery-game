<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystery Object</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eee8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .game {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 700px;
            background: white;
            border-radius: 25px;
            padding: 35px 40px 30px;
            box-shadow: 0 15px 40px rgba(90, 50, 130, 0.15);
            overflow: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        h1 {
            margin: 0;
            text-align: center;
            color: #6f2889;
            font-size: 38px;
        }

        .object-counter {
            position: absolute;
            top: 25px;
            right: 30px;
            background: #f0ebff;
            color: #6f2889;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .score,
        .timer {
            min-width: 130px;
            text-align: center;
            padding: 10px 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            background: #e8f8ed;
            color: #28864a;
        }

        .timer {
            background: #f1edff;
            color: #6f2889;
        }


        /* =========================
           MYSTERY BOX
        ========================= */

        .box-area {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gift {
            position: relative;
            width: 150px;
            height: 120px;
            animation: floatGift 2.8s ease-in-out infinite;
        }

        .gift-body {
            position: absolute;
            left: 10px;
            bottom: 0;
            width: 130px;
            height: 85px;
            background: #8d45a6;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(111, 40, 137, 0.25);
        }

        .gift-lid {
            position: absolute;
            left: 4px;
            top: 22px;
            width: 142px;
            height: 27px;
            background: #6f2889;
            border-radius: 7px;
            z-index: 3;
        }

        .gift-ribbon-vertical {
            position: absolute;
            left: 61px;
            top: 20px;
            width: 28px;
            height: 100px;
            background: #61ce70;
            z-index: 4;
        }

        .gift-ribbon-horizontal {
            position: absolute;
            left: 8px;
            top: 48px;
            width: 134px;
            height: 18px;
            background: #61ce70;
            z-index: 2;
        }

        .bow-left,
        .bow-right {
            position: absolute;
            top: 0;
            width: 48px;
            height: 32px;
            background: #61ce70;
            border-radius: 50%;
            z-index: 5;
        }

        .bow-left {
            left: 30px;
            transform: rotate(25deg);
        }

        .bow-right {
            right: 30px;
            transform: rotate(-25deg);
        }

        @keyframes floatGift {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-10px) rotate(1deg);
            }

        }


        /* =========================
           BOX INSTRUCTION
        ========================= */

        .box-instruction {
            text-align: center;
            color: #666;
            font-size: 20px;
            font-weight: bold;
            margin-top: -20px;
            margin-bottom: 20px;
        }


        /* =========================
           QUESTIONS
        ========================= */

        .question-area {
            margin-top: 5px;
        }

        .question-title {
            text-align: center;
            color: #555;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .questions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .question-btn {
            border: none;
            border-radius: 14px;
            padding: 15px;
            background: #f2edff;
            color: #6f2889;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .question-btn:hover {
            transform: translateY(-2px);
            background: #e5dbff;
        }

        .question-btn.used {
            opacity: 0.45;
            pointer-events: none;
        }


        /* =========================
           ANSWER
        ========================= */

        .answer {
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }

        .answer-text {
            font-size: 28px;
            font-weight: bold;
        }

        .answer-text.yes {
            color: #38a955;
            animation: yesAnimation 0.4s ease;
        }

        .answer-text.no {
            color: #e64c4c;
            animation: noAnimation 0.35s ease;
        }

        @keyframes yesAnimation {

            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

        @keyframes noAnimation {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-5px);
            }

        }


        /* =========================
           KNOW BUTTON
        ========================= */

        .know-btn {
            display: block;
            margin: 18px auto 0;
            border: none;
            border-radius: 16px;
            padding: 14px 30px;
            background: #61ce70;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .know-btn:hover {
            transform: scale(1.04);
            background: #4fba60;
        }


        /* =========================
           GUESS AREA
        ========================= */

        .guess-area {
            display: none;
            margin-top: 20px;
        }

        .guesses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .guess-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            background: #f2edff;
            color: #6f2889;
            padding: 14px 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .guess-btn:hover {
            background: #e2d7ff;
            transform: translateY(-2px);
        }


        /* =========================
           RESULT
        ========================= */

        .result-area {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .result-message {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result-message.correct {
            color: #38a955;
        }

        .result-message.wrong {
            color: #e64c4c;
        }


        /* =========================
           WRONG SHAKE
        ========================= */

        .result-message.wrong-shake {
            animation: wrongShake 0.5s ease-in-out;
        }

        @keyframes wrongShake {

            0% {
                transform: translateX(0);
            }

            15% {
                transform: translateX(-12px);
            }

            30% {
                transform: translateX(12px);
            }

            45% {
                transform: translateX(-10px);
            }

            60% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-6px);
            }

            90% {
                transform: translateX(6px);
            }

            100% {
                transform: translateX(0);
            }

        }


        /* =========================
           REVEALED OBJECT
        ========================= */

        .revealed-object {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .revealed-object img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            animation:
                objectReveal 0.7s ease,
                objectWiggle 2.2s ease-in-out infinite;
        }

        .object-name {
            margin-top: 8px;
            font-size: 28px;
            font-weight: bold;
            color: #6f2889;
        }


        /* =========================
           WIFE SURPRISE
        ========================= */

        .surprise {
            display: none;
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            z-index: 99999;
            pointer-events: none;
        }

        .surprise.show {
            display: block;
        }

        .surprise img {
            height: min(500px, 80vh);
            width: auto;
            max-width: 75vw;
            object-fit: contain;
            display: block;
        }

        .surprise.animate img {
            animation: wifeSurprise 2.5s ease-in-out forwards;
        }

        @keyframes wifeSurprise {

            0% {
                opacity: 0;
                transform: translateX(220px) scale(0.7) rotate(8deg);
            }

            18% {
                opacity: 1;
                transform: translateX(0) scale(1.05) rotate(-3deg);
            }

            35% {
                opacity: 1;
                transform: translateX(-5px) scale(1) rotate(2deg);
            }

            65% {
                opacity: 1;
                transform: translateX(-5px) scale(1) rotate(-1deg);
            }

            100% {
                opacity: 0;
                transform: translateX(220px) scale(0.7) rotate(8deg);
            }

        }


        /* =========================
           OBJECT ANIMATIONS
        ========================= */

        @keyframes objectReveal {

            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

        @keyframes objectWiggle {

            0%,
            100% {
                transform: rotate(0deg) translateY(0);
            }

            25% {
                transform: rotate(-3deg) translateY(-3px);
            }

            50% {
                transform: rotate(3deg) translateY(0);
            }

            75% {
                transform: rotate(-2deg) translateY(-2px);
            }

        }


        /* =========================
           FINAL SCORE
        ========================= */

        .final-score {
            display: none;
            text-align: center;
            padding: 25px 20px 30px;
            animation: finalAppear 0.5s ease;
        }

        .final-score-title {
            font-size: 30px;
            font-weight: 900;
            color: #6F2889;
            margin-bottom: 8px;
        }

        .final-score-label {
            font-size: 18px;
            color: #777;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .final-score-number {
            font-size: 58px;
            line-height: 1;
            font-weight: 900;
            color: #61CE70;
        }

        @keyframes finalAppear {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =========================
           ROUND HISTORY
        ========================= */

        .history {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .history h3 {
            margin: 0 0 10px;
            text-align: center;
            color: #6f2889;
            font-size: 21px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: center;
        }

        .history-item {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-between;
            background: #f7f4ff;
            padding: 9px 14px;
            border-radius: 10px;
            color: #555;
            font-size: 15px;
        }


        /* =========================
           NEXT / RESTART
        ========================= */

        .next-btn,
        .restart-btn {
            display: block;
            margin: 25px auto 0;
            border: none;
            border-radius: 14px;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-btn {
            background: #61ce70;
        }

        .next-btn:hover {
            background: #4fba60;
            transform: scale(1.03);
        }

        .restart-btn {
            background: #e95b5b;
        }

        .restart-btn:hover {
            background: #d94747;
            transform: scale(1.03);
        }


        /* =========================
           START OVERLAY
        ========================= */

        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(238, 232, 255, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .start-window {
            width: min(90%, 430px);
            background: white;
            border-radius: 25px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(80, 40, 110, 0.2);
            animation: startAppear 0.5s ease;
        }

        .start-icon {
            font-size: 65px;
            margin-bottom: 5px;
        }

        .start-window h2 {
            margin: 0;
            color: #6f2889;
            font-size: 32px;
        }

        .start-window p {
            color: #666;
            line-height: 1.6;
            font-size: 17px;
            margin: 12px 0 22px;
        }

        .start-button {
            border: none;
            border-radius: 16px;
            background: #61ce70;
            color: white;
            padding: 15px 28px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
            background: #4fba60;
        }

        @keyframes startAppear {

            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            body {
                padding: 10px;
            }

            .game {
                padding: 25px 18px 25px;
                min-height: auto;
            }

            h1 {
                font-size: 30px;
                margin-top: 35px;
            }

            .object-counter {
                top: 15px;
                right: 15px;
                font-size: 13px;
                padding: 7px 10px;
            }

            .questions {
                grid-template-columns: 1fr;
            }

            .guesses {
                grid-template-columns: repeat(2, 1fr);
            }

            .box-area {
                height: 190px;
            }

            .gift {
                transform: scale(0.9);
            }

            .score,
            .timer {
                min-width: 115px;
                font-size: 16px;
            }

            .history-item {
                font-size: 13px;
            }

            .surprise {
                right: 10px;
            }

            .surprise img {
                height: min(420px, 70vh);
                max-width: 70vw;
            }

        }

    </style>

</head>


<body>

<div class="game">


    <div class="object-counter" id="objectCounter">
        🔎 Object 1 of 10
    </div>


    <h1>
        🎁 Mystery Object
    </h1>


    <div class="top-bar">

        <div class="score">
            ⭐ Score: <span id="score">0</span>
        </div>

        <div class="timer">
            ⏱️ <span id="timer">0</span> sec
        </div>

    </div>


    <div class="box-area" id="boxArea">

        <div class="gift">

            <div class="bow-left"></div>
            <div class="bow-right"></div>

            <div class="gift-lid"></div>

            <div class="gift-ribbon-horizontal"></div>

            <div class="gift-body"></div>

            <div class="gift-ribbon-vertical"></div>

        </div>

    </div>


    <div class="box-instruction" id="boxInstruction">
        What's inside the mystery box?
    </div>


    <div class="question-area" id="questionArea">

        <div class="question-title">
            Ask a question!
        </div>


        <div class="questions">

            <button
                class="question-btn"
                onclick="askQuestion('animal', this)">
                Is it an animal?
            </button>

            <button
                class="question-btn"
                onclick="askQuestion('food', this)">
                Is it food?
            </button>

            <button
                class="question-btn"
                onclick="askQuestion('toy', this)">
                Is it a toy?
            </button>

            <button
                class="question-btn"
                onclick="askQuestion('big', this)">
                Is it big?
            </button>

            <button
                class="question-btn"
                onclick="askQuestion('red', this)">
                Is it red?
            </button>

            <button
                class="question-btn"
                onclick="askQuestion('round', this)">
                Is it round?
            </button>

        </div>


        <button
            class="know-btn"
            id="knowButton"
            onclick="showGuesses()">
            I KNOW IT!
        </button>

    </div>


    <div class="answer">

        <div id="answerText"></div>

    </div>


    <div
        class="guess-area"
        id="guessArea">

        <div
            class="guesses"
            id="guessButtons">
        </div>

    </div>


    <div
        class="result-area"
        id="resultArea">

        <div
            class="result-message"
            id="resultMessage">
        </div>

        <div
            class="revealed-object"
            id="revealedObject"
            style="display: none;">

            <img
                id="revealedImage"
                src=""
                alt="">

            <div
                class="object-name"
                id="objectName">
            </div>

        </div>

    </div>


    <div
        class="final-score"
        id="finalScore">
    </div>


    <div class="history">

        <h3>
            🏆 Your Rounds
        </h3>

        <div
            class="history-list"
            id="historyList">
        </div>

    </div>


    <button
        class="next-btn"
        id="nextButton"
        onclick="nextObject()"
        style="display: none;">
        ➡️ NEXT OBJECT!
    </button>


    <button
        class="restart-btn"
        id="restartButton"
        onclick="restartGame()">
        🔄 RESTART GAME
    </button>


    <div
        class="start-overlay"
        id="startOverlay">

        <div class="start-window">

            <div class="start-icon">
                🎁
            </div>

            <h2>
                Mystery Object
            </h2>

            <p>
                What's inside the mystery box?<br>
                Ask questions and guess the object!
            </p>

            <button
                class="start-button"
                onclick="startGame()">
                ▶️ START GAME
            </button>

        </div>

    </div>

</div>


<div
    class="surprise"
    id="surprise">

    <img
        src="./images/esimin-emoji.png"
        alt="Surprise">

</div>


<script>


/* ==========================================
   OBJECTS
========================================== */

const objects = {

    apple: {
        animal: false,
        food: true,
        toy: false,
        big: false,
        red: true,
        round: false
    },

    dog: {
        animal: true,
        food: false,
        toy: false,
        big: false,
        red: false,
        round: false
    },

    car: {
        animal: false,
        food: false,
        toy: false,
        big: true,
        red: true,
        round: false
    },

    banana: {
        animal: false,
        food: true,
        toy: false,
        big: false,
        red: false,
        round: false
    },

    ball: {
        animal: false,
        food: false,
        toy: true,
        big: false,
        red: true,
        round: true
    },

    cat: {
        animal: true,
        food: false,
        toy: false,
        big: false,
        red: false,
        round: false
    },

    orange: {
        animal: false,
        food: true,
        toy: false,
        big: false,
        red: false,
        round: true
    },

    teddy: {
        animal: false,
        food: false,
        toy: true,
        big: false,
        red: false,
        round: false
    },

    fish: {
        animal: true,
        food: false,
        toy: false,
        big: false,
        red: false,
        round: false
    },

    pizza: {
        animal: false,
        food: true,
        toy: false,
        big: false,
        red: true,
        round: true
    }

};

/* ==========================================
   SOUND SYSTEM
========================================== */

const sounds = {
    click: new Audio("./sounds/click.mp3"),
    yes: new Audio("./sounds/yes.mp3"),
    no: new Audio("./sounds/no.mp3"),
    success: new Audio("./sounds/success.mp3"),
    correct: new Audio("./sounds/correct.mp3"),
    wrong: new Audio("./sounds/wrong.mp3")
};

Object.values(sounds).forEach((sound) => {
    sound.preload = "auto";
    sound.volume = 1;
});


/* ==========================================
   WRONG SOUND
========================================== */

function playWrongSound() {
    const audio = new Audio("./sounds/wrong.mp3");
    audio.volume = 1;

    audio.play()
        .then(() => {
            console.log("WRONG AUDIO PLAYED");
        })
        .catch((error) => {
            console.error("WRONG AUDIO ERROR:", error);
        });

}



/* ==========================================
   NORMAL SOUND
========================================== */

function playSound(sound) {

    if (!sound) {
        return;
    }

    sound.pause();

    sound.currentTime = 0;

    sound.play().catch((error) => {

        console.error(
            "Sound playback error:",
            error
        );

    });

}


/* ==========================================
   VARIABLES
========================================== */

let objectList = Object.keys(objects);

let currentObjectIndex = 0;

let currentObject = "";

let score = 0;

let questionCount = 0;

let timer = 0;

let timerInterval = null;

let gameStarted = false;

let roundNumber = 0;

let roundHistory = [];

let roundStartScore = 0;


/* ==========================================
   ELEMENTS
========================================== */

const scoreElement =
    document.getElementById("score");

const timerElement =
    document.getElementById("timer");

const objectCounter =
    document.getElementById("objectCounter");

const answerText =
    document.getElementById("answerText");

const questionArea =
    document.getElementById("questionArea");

const guessArea =
    document.getElementById("guessArea");

const guessButtons =
    document.getElementById("guessButtons");

const resultArea =
    document.getElementById("resultArea");

const resultMessage =
    document.getElementById("resultMessage");

const revealedObject =
    document.getElementById("revealedObject");

const revealedImage =
    document.getElementById("revealedImage");

const objectName =
    document.getElementById("objectName");

const finalScore =
    document.getElementById("finalScore");

const historyList =
    document.getElementById("historyList");

const startOverlay =
    document.getElementById("startOverlay");

const knowButton =
    document.getElementById("knowButton");

const boxArea =
    document.getElementById("boxArea");

const boxInstruction =
    document.getElementById("boxInstruction");

const surprise =
    document.getElementById("surprise");

const nextButton =
    document.getElementById("nextButton");

const restartButton =
    document.getElementById("restartButton");


/* ==========================================
   SHUFFLE
========================================== */

function shuffleObjects() {

    objectList = Object.keys(objects);

    for (
        let i = objectList.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            objectList[i],
            objectList[j]
        ] = [
            objectList[j],
            objectList[i]
        ];

    }

}


/* ==========================================
   PREPARE OBJECT
========================================== */

function prepareObject() {

    currentObject =
        objectList[currentObjectIndex];

    objectCounter.textContent =
        `🔎 Object ${currentObjectIndex + 1} of 10`;

}


/* ==========================================
   START GAME
========================================== */

function startGame() {

    playSound(sounds.click);

    startOverlay.style.display =
        "none";

    if (!gameStarted) {

        gameStarted = true;

        roundStartScore = score;

        startTimer();

    }

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

    clearInterval(timerInterval);

    timerInterval =
        setInterval(() => {

            timer++;

            timerElement.textContent =
                timer;

        }, 1000);

}


function stopTimer() {

    clearInterval(timerInterval);

    timerInterval = null;

}


/* ==========================================
   ASK QUESTION
========================================== */

function askQuestion(property, button) {

    if (!gameStarted) {
        return;
    }

    if (questionCount >= 6) {
        return;
    }

    questionCount++;

    button.classList.add("used");

    const answer =
        objects[currentObject][property];


    answerText.className = "";
    answerText.textContent = "";
    void answerText.offsetWidth;


    if (answer) {

        setTimeout(() => {

            playSound(sounds.yes);

        }, 50);


        answerText.textContent =
            "👍 YES!";

        answerText.className =
            "answer-text yes";

    }

    else {

        setTimeout(() => {

            playSound(sounds.no);

        }, 50);


        answerText.textContent =
            "❌ NO!";

        answerText.className =
            "answer-text no";

    }


    if (questionCount >= 6) {

        knowButton.textContent =
            "MAKE YOUR GUESS!";

    }

}

/* ==========================================
   SHOW GUESSES
========================================== */

function showGuesses() {

    if (!gameStarted) {
        return;
    }

    playSound(sounds.click);

    questionArea.style.display =
        "none";

    guessArea.style.display =
        "block";

    answerText.textContent =
        "";

    answerText.className =
        "";

    guessButtons.innerHTML =
        "";

    resultArea.style.display =
        "none";

    resultMessage.textContent =
        "";

    resultMessage.className =
        "result-message";

    revealedObject.style.display =
        "none";


    objectList.forEach((object) => {

        const button =
            document.createElement("button");

        button.className =
            "guess-btn";

        button.textContent =
            capitalize(object);

        button.onclick =
            () => makeGuess(object);

        guessButtons.appendChild(button);

    });

}


/* ==========================================
   SHOW WIFE SURPRISE
========================================== */

function showWifeSurprise() {

    surprise.classList.remove("show");

    surprise.classList.remove("animate");

    void surprise.offsetWidth;

    surprise.classList.add("show");

    surprise.classList.add("animate");


    setTimeout(() => {

        surprise.classList.remove("animate");

        surprise.classList.remove("show");

    }, 2500);

}


/* ==========================================
   MAKE GUESS
========================================== */

function makeGuess(guess) {

    if (!gameStarted) {
        return;
    }


    /* =========================
       CORRECT
    ========================= */

    if (guess === currentObject) {

        playSound(sounds.correct);

        score += 20;

        scoreElement.textContent =
            score;

        resultMessage.textContent =
            "Correct! +20 points";

        resultMessage.className =
            "result-message correct";


        revealedImage.src =
            `./images/${currentObject}.png`;

        revealedImage.alt =
            capitalize(currentObject);

        objectName.textContent =
            capitalize(currentObject);


        revealedObject.style.display =
            "flex";


        showWifeSurprise();


        boxArea.style.display =
            "none";

        boxInstruction.style.display =
            "none";

        guessArea.style.display =
            "none";

        resultArea.style.display =
            "block";


        stopTimer();

        gameStarted = false;


        const roundPoints =
            score - roundStartScore;

        saveRound(roundPoints);


        if (currentObjectIndex === 9) {

            nextButton.style.display =
                "none";

            setTimeout(() => {

                showFinalScore();

            }, 1000);

        }

        else {

            nextButton.style.display =
                "block";

        }

        return;
    }


    /* =========================
       WRONG
    ========================= */

    score -= 5;

    scoreElement.textContent =
        score;


    resultArea.style.display =
        "block";

    guessArea.style.display =
        "block";

    revealedObject.style.display =
        "none";


    /* Reset animation completely */

    resultMessage.classList.remove(
        "wrong-shake"
    );

    resultMessage.classList.remove(
        "wrong"
    );

    resultMessage.classList.remove(
        "correct"
    );

    void resultMessage.offsetWidth;


    /* Wrong message */

    resultMessage.textContent =
        "Wrong! -5 points. Try again!";


    resultMessage.classList.add(
        "wrong"
    );


    /* Start shake */

    resultMessage.classList.add(
        "wrong-shake"
    );


    /* Play ONLY wrong.mp3 */

    playWrongSound();
    

}


/* ==========================================
   SAVE ROUND
========================================== */

function saveRound(roundPoints) {

    roundNumber++;

    roundHistory.push({

        round: roundNumber,

        time: timer,

        points: roundPoints,

        total: score

    });

    updateHistory();

}


/* ==========================================
   UPDATE HISTORY
========================================== */

function updateHistory() {

    historyList.innerHTML =
        "";

    roundHistory.forEach((round) => {

        const item =
            document.createElement("div");

        item.className =
            "history-item";

        item.innerHTML = `

            <span>
                Round ${round.round}
            </span>

            <span>
                ⏱️ ${round.time} sec
            </span>

            <span>
                ⭐ ${round.points > 0 ? "+" : ""}${round.points} pts
            </span>

        `;

        historyList.appendChild(item);

    });

}


/* ==========================================
   NEXT OBJECT
========================================== */

function nextObject() {

    playSound(sounds.click);

    stopTimer();

    currentObjectIndex++;

    prepareObject();

    questionCount = 0;

    timer = 0;

    timerElement.textContent =
        "0";

    gameStarted = true;

    roundStartScore = score;


    answerText.textContent =
        "";

    answerText.className =
        "";


    questionArea.style.display =
        "block";

    knowButton.textContent =
        "I KNOW IT!";


    document
        .querySelectorAll(".question-btn")
        .forEach((button) => {

            button.classList.remove("used");

        });


    guessArea.style.display =
        "none";

    guessButtons.innerHTML =
        "";


    resultArea.style.display =
        "none";

    resultMessage.textContent =
        "";

    resultMessage.className =
        "result-message";


    revealedObject.style.display =
        "none";

    revealedImage.src =
        "";

    objectName.textContent =
        "";


    surprise.classList.remove("animate");

    surprise.classList.remove("show");


    finalScore.style.display =
        "none";

    nextButton.style.display =
        "none";


    boxArea.style.display =
        "flex";

    boxInstruction.style.display =
        "block";


    startTimer();

}


/* ==========================================
   RESTART GAME
========================================== */

function restartGame() {

    playSound(sounds.click);

    stopTimer();

    currentObjectIndex = 0;

    shuffleObjects();

    currentObject = "";

    score = 0;

    questionCount = 0;

    timer = 0;

    gameStarted = false;

    roundNumber = 0;

    roundHistory = [];

    roundStartScore = 0;


    scoreElement.textContent =
        "0";

    timerElement.textContent =
        "0";


    updateHistory();

    prepareObject();


    questionArea.style.display =
        "block";

    knowButton.textContent =
        "I KNOW IT!";


    document
        .querySelectorAll(".question-btn")
        .forEach((button) => {

            button.classList.remove("used");

        });


    guessArea.style.display =
        "none";

    guessButtons.innerHTML =
        "";


    resultArea.style.display =
        "none";

    resultMessage.textContent =
        "";

    resultMessage.className =
        "result-message";


    revealedObject.style.display =
        "none";

    revealedImage.src =
        "";

    objectName.textContent =
        "";


    surprise.classList.remove("animate");

    surprise.classList.remove("show");


    finalScore.style.display =
        "none";

    nextButton.style.display =
        "none";


    restartButton.textContent =
        "🔄 RESTART GAME";

    restartButton.onclick =
        restartGame;


    boxArea.style.display =
        "flex";

    boxInstruction.style.display =
        "block";


    startOverlay.style.display =
        "flex";

}


/* ==========================================
   PLAY AGAIN
========================================== */

function playAgain() {

    playSound(sounds.click);

    stopTimer();

    currentObjectIndex = 0;

    shuffleObjects();

    currentObject = "";

    score = 0;

    questionCount = 0;

    timer = 0;

    gameStarted = false;

    roundNumber = 0;

    roundHistory = [];

    roundStartScore = 0;


    scoreElement.textContent =
        "0";

    timerElement.textContent =
        "0";


    updateHistory();

    prepareObject();


    questionArea.style.display =
        "block";

    knowButton.textContent =
        "I KNOW IT!";


    document
        .querySelectorAll(".question-btn")
        .forEach((button) => {

            button.classList.remove("used");

        });


    guessArea.style.display =
        "none";

    guessButtons.innerHTML =
        "";


    resultArea.style.display =
        "none";

    resultMessage.textContent =
        "";

    resultMessage.className =
        "result-message";


    revealedObject.style.display =
        "none";

    revealedImage.src =
        "";

    objectName.textContent =
        "";


    surprise.classList.remove("animate");

    surprise.classList.remove("show");


    finalScore.style.display =
        "none";

    nextButton.style.display =
        "none";


    boxArea.style.display =
        "flex";

    boxInstruction.style.display =
        "block";


    startOverlay.style.display =
        "flex";


    restartButton.textContent =
        "🔄 RESTART GAME";

    restartButton.onclick =
        restartGame;

}


/* ==========================================
   FINAL SCORE
========================================== */

function showFinalScore() {

    playSound(sounds.success);


    finalScore.innerHTML = `

        <div class="final-score-title">
            ${getFinalMessage()}
        </div>

        <div class="final-score-label">
            🎉 You completed all 10 objects!
        </div>

        <div class="final-score-label">
            Final Score
        </div>

        <div class="final-score-number">
            ${score}
        </div>

    `;


    finalScore.style.display =
        "block";


    nextButton.style.display =
        "none";


    restartButton.textContent =
        "🔄 PLAY AGAIN";

    restartButton.onclick =
        playAgain;

}


/* ==========================================
   FINAL MESSAGE
========================================== */

function getFinalMessage() {

    if (score >= 100) {

        return "🎉 GREAT JOB!";

    }

    else if (score >= 50) {

        return "👍 GOOD JOB!";

    }

    else if (score >= 0) {

        return "💪 KEEP TRYING!";

    }

    else {

        return "🌟 DON'T GIVE UP!";

    }

}


/* ==========================================
   CAPITALIZE
========================================== */

function capitalize(word) {

    return word.charAt(0).toUpperCase()
        + word.slice(1);

}


/* ==========================================
   INITIAL SETUP
========================================== */

shuffleObjects();

prepareObject();

updateHistory();


</script>

</body>

</html>
